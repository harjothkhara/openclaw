name: Mac New Thread red control
run-name: Issue 186215 base red / ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact fork proof commit containing only the test and workflow
        required: true
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mac-new-thread-186215-red
  cancel-in-progress: false

jobs:
  mac-new-thread-red:
    if: github.repository == 'harjothkhara/openclaw' && github.ref == 'refs/heads/proof/mac-new-thread-186215-2026-10-27'
    runs-on: macos-26-intel
    timeout-minutes: 75
    steps:
      - name: Check out exact proof commit
        uses: actions/checkout@v4
        with:
          repository: harjothkhara/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify base and test-only delta
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-logs
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$TARGET_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD^)" == "1b50ce5a6835798634c4d98ac87891f4e5290120" ]]
          git diff --name-only HEAD^ HEAD | sort > proof-logs/changed-files.log
          printf '%s\n' '.github/workflows/ci.yml' 'apps/macos/Tests/OpenClawIPCTests/MacGatewayChatTransportMappingTests.swift' | sort > proof-logs/expected-files.log
          cmp proof-logs/changed-files.log proof-logs/expected-files.log
          printf 'Base: %s\nTest commit: %s\nWorkflow: %s\n' "$(git rev-parse HEAD^)" "$TARGET_SHA" "$GITHUB_SHA" | tee proof-logs/identity.log

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Select supported Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee proof-logs/install.log

      - name: Prepare native assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-apple-mermaid.mjs 2>&1 | tee proof-logs/assets.log

      - name: Restore exact proof build
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/macos/.build
          key: mac-new-thread-native-macos-26-intel-${{ inputs.target_sha }}-${{ hashFiles('apps/macos/Package.resolved') }}

      - name: Build native test bundle
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path apps/macos --build-system native --build-tests 2>&1 | tee proof-logs/build.log

      - name: Save exact proof build
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: apps/macos/.build
          key: mac-new-thread-native-macos-26-intel-${{ inputs.target_sha }}-${{ hashFiles('apps/macos/Package.resolved') }}

      - name: Require finite base-red regression
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/test-macos-native.mts named \
            --package-path apps/macos --build-system native \
            --enable-code-coverage --skip-build \
            --filter 'MacGatewayChatTransportMappingTests/explicitSessionCreationUsesCapturedGateway' \
            2>&1 | tee proof-logs/red-test.log
          test_status="${PIPESTATUS[0]}"
          set -e
          [[ "$test_status" -ne 0 ]]
          grep -Fq 'explicitSessionCreationUsesCapturedGateway' proof-logs/red-test.log
          grep -Fq 'sessions.create agent/base-ref options not supported by this transport' proof-logs/red-test.log
          grep -Eq 'Test run with 1 test.*failed|Executed 1 test' proof-logs/red-test.log
          printf 'Expected base failure confirmed; test exit=%s\n' "$test_status" | tee proof-logs/verdict.log

      - name: Upload complete proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-new-thread-base-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof-logs/
          if-no-files-found: error
