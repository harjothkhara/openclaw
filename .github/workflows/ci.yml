name: Mac Launch at Login proof

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact public openclaw/openclaw commit to test
        required: true
        type: string
        default: 8c3f21a2acf73c15c849de64b8a2f3d499b003f3

permissions:
  contents: read

jobs:
  launch-agent-manager:
    if: github.repository == 'harjothkhara/openclaw'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out exact upstream revision
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual="$(git rev-parse HEAD)"
          printf 'Requested: %s\nChecked out: %s\n' "$TARGET_SHA" "$actual"
          [[ "$actual" == "$TARGET_SHA" ]]

      - name: Set up Node and pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - name: Select supported Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install native asset dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-logs
          pnpm install --frozen-lockfile 2>&1 | tee proof-logs/install.log

      - name: Prepare Apple Mermaid assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-apple-mermaid.mjs 2>&1 | tee proof-logs/assets.log

      - name: Build macOS test bundle
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path apps/macos --build-system native --build-tests 2>&1 | tee proof-logs/build.log

      - name: Run isolated LaunchAgentManagerTests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-macos-native.mts default \
            --package-path apps/macos \
            --build-system native \
            --skip-build \
            --filter LaunchAgentManagerTests 2>&1 | tee proof-logs/test.log

      - name: Upload complete proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-launch-agent-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof-logs/
          if-no-files-found: warn
          retention-days: 7
