name: Mac New Thread green proof
run-name: Issue 186215 PR green / ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact upstream PR head SHA
        required: true
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mac-new-thread-186215-green
  cancel-in-progress: false

jobs:
  mac-new-thread-green:
    if: github.repository == 'harjothkhara/openclaw' && github.ref == 'refs/heads/proof/mac-new-thread-186215-2026-10-27'
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Check out exact upstream PR revision
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact source and current PR branch
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-logs
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          branch_sha="$(git ls-remote https://github.com/openclaw/openclaw.git refs/heads/openclaw/marine-crayfish-3 | cut -f1)"
          [[ "$branch_sha" == "$TARGET_SHA" ]]
          printf 'PR: 186259\nSource: %s\nPR branch: %s\nWorkflow: %s\n' "$TARGET_SHA" "$branch_sha" "$GITHUB_SHA" | tee proof-logs/identity.log
          git show -s --format='%H%n%an <%ae>%n%B' HEAD > proof-logs/commit.log

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Select supported Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee proof-logs/install.log

      - name: Prepare native assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-apple-mermaid.mjs 2>&1 | tee proof-logs/assets.log

      - name: Restore exact PR native build
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/macos/.build
          key: mac-new-thread-native-macos-26-intel-${{ inputs.target_sha }}-${{ hashFiles('apps/macos/Package.resolved') }}

      - name: Build native tests and Mac app
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path apps/macos --build-system native --build-tests 2>&1 | tee proof-logs/build-tests.log
          swift build --package-path apps/macos --build-system native --product OpenClaw 2>&1 | tee proof-logs/build-app.log

      - name: Save exact PR native build
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: apps/macos/.build
          key: mac-new-thread-native-macos-26-intel-${{ inputs.target_sha }}-${{ hashFiles('apps/macos/Package.resolved') }}

      - name: Require transport regressions green
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-macos-native.mts named \
            --package-path apps/macos --build-system native \
            --enable-code-coverage --skip-build \
            --filter MacGatewayChatTransportMappingTests \
            2>&1 | tee proof-logs/transport-tests.log
          grep -Fq 'explicitSessionCreationUsesCapturedGateway' proof-logs/transport-tests.log
          grep -Eq 'Test run with [1-9][0-9]* tests.*passed|Executed [1-9][0-9]* tests.*0 failures' proof-logs/transport-tests.log

      - name: Install pinned Swift lint tools
        shell: bash
        run: |
          set -euo pipefail
          scripts/install-swift-tools.sh .build/swift-tools 2>&1 | tee proof-logs/swift-tools.log
          echo "$PWD/.build/swift-tools" >> "$GITHUB_PATH"

      - name: Check native Swift format and lint
        shell: bash
        run: |
          set -euo pipefail
          scripts/format-swift.sh macos 2>&1 | tee proof-logs/swiftformat.log
          scripts/lint-swift.sh macos 2>&1 | tee proof-logs/swiftlint.log

      - name: Upload complete proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-new-thread-green-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof-logs/
          if-no-files-found: error
