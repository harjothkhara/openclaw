name: Android Files native retry proof (fork only)
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Repository containing exact PR head 28328419 (public fork or upstream)
        required: true
        default: openclaw/openclaw
permissions:
  contents: read
concurrency:
  group: android-files-native-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository != 'openclaw/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      BASELINE_SHA: 3fed691416b37f91b0db8dd77446f739e7bf92af
      CANDIDATE_SHA: 28328419c54b3ef02cde5cc956b32139b3a86721
      CANDIDATE_TREE: 39a4fb9ed20cd067442ccf8ca1d957f85bd33bed
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      ANDROID_SERIAL: emulator-5554
    steps:
      - name: Exact normal product source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repository }}
          ref: 28328419c54b3ef02cde5cc956b32139b3a86721
          fetch-depth: 1
          persist-credentials: false
      - name: Fork-only harness, not product PR
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .files-proof-harness
          sparse-checkout: proof/android-files
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Existing Android/KVM setup
        id: android
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: 'off'
          install-native-deps: 'true'
          install-screenshot-emulators: 'true'
      - name: Build exact baseline/candidate normal APKs and external UI test APKs
        env:
          JAVA_HOME: ${{ steps.android.outputs.gradle-java-home }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git "$BASELINE_SHA"
          git worktree add --detach "$RUNNER_TEMP/files-baseline" "$BASELINE_SHA"
          export FILES_PROOF_DRIVER_DIR="$GITHUB_WORKSPACE/.files-proof-harness/proof/android-files"
          cat > "$RUNNER_TEMP/files-proof.init.gradle" <<'GRADLE'
          def driver = System.getenv('FILES_PROOF_DRIVER_DIR')
          if (!driver) throw new GradleException('FILES_PROOF_DRIVER_DIR missing')
          gradle.beforeProject { p ->
            p.pluginManager.withPlugin('com.android.application') {
              p.extensions.getByName('android').sourceSets.getByName('androidTest').kotlin.directories.add(driver)
            }
          }
          GRADLE
          for root in "$RUNNER_TEMP/files-baseline" "$GITHUB_WORKSPACE"; do
            (cd "$root" && pnpm install --frozen-lockfile)
            (cd "$root/apps/android" && ./gradlew --no-daemon --max-workers=2 -I "$RUNNER_TEMP/files-proof.init.gradle" :app:assembleThirdPartyDebug :app:assembleThirdPartyDebugAndroidTest)
            test -z "$(git -C "$root" status --porcelain --untracked-files=no)"
          done
          python3 - <<'PY'
          import os, pathlib, subprocess, json, hashlib, zipfile
          def record(root):
            root=pathlib.Path(root)
            apks=list((root/'apps/android/app/build/outputs/apk').rglob('*.apk'))
            normal=[p for p in apks if 'androidTest' not in str(p) and 'thirdParty/debug' in str(p)]
            tests=[p for p in apks if 'androidTest' in str(p) and 'thirdParty/debug' in str(p)]
            assert len(normal)==len(tests)==1, [str(p) for p in apks]
            with zipfile.ZipFile(tests[0]) as z:
              assert any(b'AndroidFilesRetryProof' in z.read(n) for n in z.namelist() if n.endswith('.dex')), 'External proof driver missing from test APK'
            git=lambda ref:subprocess.check_output(['git','-C',str(root),'rev-parse',ref],text=True).strip()
            return dict(root=str(root),sha=git('HEAD'),tree=git('HEAD^{tree}'),apk=str(normal[0]),testApk=str(tests[0]))
          data={'baseline':record(os.environ['RUNNER_TEMP']+'/files-baseline'),'candidate':record(os.environ['GITHUB_WORKSPACE'])}
          pathlib.Path(os.environ['RUNNER_TEMP']+'/files-apks.json').write_text(json.dumps(data,indent=2))
          PY
      - name: Phone-only KVM normal onboarding and Files flow
        shell: bash
        run: |
          set -euo pipefail
          test -r /dev/kvm && test -w /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name files-proof-phone --package 'system-images;android-36;google_apis;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd files-proof-phone -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -accel on -gpu swiftshader_indirect -cores 2 -memory 3072 > "$RUNNER_TEMP/files-emulator.log" 2>&1 &
          EMU_PID=$!
          trap 'kill "$EMU_PID" 2>/dev/null || true' EXIT
          timeout 90s adb wait-for-device
          for n in $(seq 1 180); do
            kill -0 "$EMU_PID"
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\n')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\n')" = 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          pnpm exec tsx "$GITHUB_WORKSPACE/.files-proof-harness/proof/android-files/controller.mjs" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/files-apks.json" "$GITHUB_WORKSPACE/native-files-proof-output"
      - name: Keep sanitized native evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-files-native-28328419
          path: native-files-proof-output
          if-no-files-found: warn
          retention-days: 7

