name: Mac New Thread real-app proof
run-name: Issue 186215 base-red and PR-green / ${{ inputs.target_sha }}
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact upstream PR head SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mac-new-thread-186215-real-app
  cancel-in-progress: false
jobs:
  mac-new-thread-real-app:
    if: github.repository == 'harjothkhara/openclaw' && github.ref == 'refs/heads/proof/mac-new-thread-186215-2026-10-27'
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      BASE_SHA: 1b50ce5a6835798634c4d98ac87891f4e5290120
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out fork-only proof driver
        uses: actions/checkout@v4
        with:
          path: proof-runner
          persist-credentials: false
          sparse-checkout: |
            proof
            package.json
      - name: Check out exact unfixed source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: ${{ env.BASE_SHA }}
          path: sut-red
          persist-credentials: false
      - name: Check out exact PR source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: ${{ env.TARGET_SHA }}
          path: sut-green
          persist-credentials: false
      - name: Verify exact source and driver
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C sut-red rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ "$(git -C sut-green rev-parse HEAD)" == "$TARGET_SHA" ]]
          branch_sha="$(git ls-remote https://github.com/openclaw/openclaw.git refs/heads/openclaw/marine-crayfish-3 | cut -f1)"
          [[ "$branch_sha" == "$TARGET_SHA" ]]
          echo '730ead33948d2cffe2c109f4f3cbce9eacaf20fd6000d2395c4fa9a540e6d6ee  proof-runner/proof/new-thread.mjs' | shasum -a 256 -c
          echo '2a00074eb09376e2bab0f2569bbab9940bd04192363f89edccc80ce31f535f24  proof-runner/proof/new-thread-ax.js' | shasum -a 256 -c
          node --check proof-runner/proof/new-thread.mjs
          printf 'Base %s\nPR %s\nWorkflow %s\n' "$BASE_SHA" "$TARGET_SHA" "$GITHUB_SHA"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - name: Select supported Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Preflight hosted GUI and Accessibility
        shell: bash
        run: |
          set -euo pipefail
          launchctl print "gui/$(id -u)" >/dev/null
          /usr/bin/perl -e 'alarm 15; exec @ARGV' /usr/bin/osascript -l JavaScript \
            -e 'var se = Application("System Events"); var p = se.processes(); if (p.length < 1) throw Error("No accessible GUI processes"); p.length' \
            > /dev/null
          [[ "$(/usr/bin/perl -e 'alarm 15; exec @ARGV' /usr/bin/osascript \
            -e 'tell application "System Events" to get UI elements enabled')" == true ]]
          /usr/bin/perl -e 'alarm 15; exec @ARGV' /usr/sbin/screencapture -x -t png "$GITHUB_WORKSPACE/gui-preflight.png"
          /usr/bin/sips -g pixelWidth -g pixelHeight "$GITHUB_WORKSPACE/gui-preflight.png" \
            > "$GITHUB_WORKSPACE/gui-preflight-dimensions.txt"
          test -s "$GITHUB_WORKSPACE/gui-preflight.png"
      - name: Restore exact base native build
        id: base-cache
        uses: actions/cache/restore@v4
        with:
          path: sut-red/apps/macos/.build
          key: mac-new-thread-package-macos-26-intel-${{ env.BASE_SHA }}-${{ hashFiles('sut-red/apps/macos/Package.resolved') }}
      - name: Build unfixed Mac app and Gateway
        shell: bash
        run: |
          set -euo pipefail
          cd sut-red
          BUILD_ARCHS="$(uname -m)" BUILD_CONFIG=debug ALLOW_ADHOC_SIGNING=1 OPENCLAW_SKIP_MLX_TTS=1 \
            /bin/bash scripts/package-mac-app.sh > "$GITHUB_WORKSPACE/red-package.log" 2>&1
      - name: Save exact base native build
        if: ${{ steps.base-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: sut-red/apps/macos/.build
          key: mac-new-thread-package-macos-26-intel-${{ env.BASE_SHA }}-${{ hashFiles('sut-red/apps/macos/Package.resolved') }}
      - name: Run guarded real-app red control
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          node proof-runner/proof/new-thread.mjs \
            --source "$GITHUB_WORKSPACE/sut-red" --app "$GITHUB_WORKSPACE/sut-red/dist/OpenClaw.app" \
            --sha "$BASE_SHA" --mode red --out "$GITHUB_WORKSPACE/new-thread-red"
      - name: Release disposable base checkout
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/sut-red"
      - name: Restore exact PR native build
        id: green-cache
        uses: actions/cache/restore@v4
        with:
          path: sut-green/apps/macos/.build
          key: mac-new-thread-package-macos-26-intel-${{ env.TARGET_SHA }}-${{ hashFiles('sut-green/apps/macos/Package.resolved') }}
      - name: Build PR Mac app and Gateway
        shell: bash
        run: |
          set -euo pipefail
          cd sut-green
          BUILD_ARCHS="$(uname -m)" BUILD_CONFIG=debug ALLOW_ADHOC_SIGNING=1 OPENCLAW_SKIP_MLX_TTS=1 \
            /bin/bash scripts/package-mac-app.sh > "$GITHUB_WORKSPACE/green-package.log" 2>&1
      - name: Save exact PR native build
        if: ${{ steps.green-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: sut-green/apps/macos/.build
          key: mac-new-thread-package-macos-26-intel-${{ env.TARGET_SHA }}-${{ hashFiles('sut-green/apps/macos/Package.resolved') }}
      - name: Run guarded real-app green control
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          node proof-runner/proof/new-thread.mjs \
            --source "$GITHUB_WORKSPACE/sut-green" --app "$GITHUB_WORKSPACE/sut-green/dist/OpenClaw.app" \
            --sha "$TARGET_SHA" --mode green --out "$GITHUB_WORKSPACE/new-thread-green"
      - name: Require exact-head red and green verdicts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [arm, status, sha] of [
            ['red', 'expected-red', process.env.BASE_SHA],
            ['green', 'green', process.env.TARGET_SHA],
          ]) {
            const r = JSON.parse(fs.readFileSync('new-thread-' + arm + '/evidence/verdict.json', 'utf8'));
            if (r.status !== status || r.sourceSha !== sha || r.providerPosts !== 0 ||
                r.cleanup !== 'owned-process-groups-retired') {
              throw new Error(arm + ' verdict did not meet required proof contract');
            }
          }
          NODE
      - name: Redact package log paths
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for log in red-package.log green-package.log; do
            if [[ -f "$log" ]]; then
              sed -i '' -e "s|$GITHUB_WORKSPACE|[WORKSPACE]|g" -e "s|$HOME|[HOME]|g" "$log"
            fi
          done
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-new-thread-real-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            new-thread-red/evidence/
            new-thread-green/evidence/
            gui-preflight-dimensions.txt
            red-package.log
            green-package.log
          if-no-files-found: error
