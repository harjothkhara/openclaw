# Coordinator-owned fork branch only. No product checkout or app build exists in this workflow.
name: Mac accent helper and runner diagnostic
run-name: PR 185529 helper and runner diagnostic / ${{ inputs.proof_sha }}
on:
  workflow_dispatch:
    inputs:
      proof_sha:
        description: Exact reviewed fork proof commit, not the product PR SHA
        required: true
        type: string
      helper_only:
        description: Must be true; there is no app-build mode
        required: true
        default: true
        type: boolean
      serial_confirmed:
        description: "Coordinator reserved the native proof lane and verified #186259 idle"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
# This exact group is used by the verified #186259 fork workflow. Do not dispatch
# while that lane has a running/pending request: GitHub can replace pending group runs.
concurrency:
  group: mac-new-thread-186215-real-app
  cancel-in-progress: false
jobs:
  admission:
    if: github.repository == 'harjothkhara/openclaw' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            proof/mac-accent-185529
            .github/workflows/ci.yml
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const { admit } = require(process.env.GITHUB_WORKSPACE + '/proof/mac-accent-185529/helper-admission.cjs');
            const receipt = await admit({ github, context });
            core.info(JSON.stringify(receipt));
  compiled-helper:
    needs: admission
    if: github.run_attempt == 1 && inputs.helper_only
    runs-on: macos-26-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            proof/mac-accent-185529
            .github/workflows/ci.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Verify source and synthetic Node guards
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=normal)" ]]
          mkdir -p accent-preflight/evidence
          node -e 'require("node:fs").writeFileSync("accent-preflight/evidence/run.json",JSON.stringify({kind:"compiled-helper-only",appBuilds:0,proofSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT}))'
          cd proof/mac-accent-185529
          shasum -a 256 -c HELPER_SHA256SUMS
          node --check pixel-preflight.mjs
          node --check helper-admission.cjs
          node --test pixel-preflight.test.mjs helper-admission.test.cjs
      - name: Compile and exercise the actual pixel helper
        shell: bash
        run: |
          set -euo pipefail
          cd proof/mac-accent-185529
          xcrun swiftc window.swift -o "$RUNNER_TEMP/accent-window-helper" > "$GITHUB_WORKSPACE/accent-preflight/evidence/helper-compile.log" 2>&1
          node pixel-preflight.mjs
      - name: Compile and diagnose the owned runner window (not product proof)
        shell: bash
        run: |
          set -euo pipefail
          cd proof/mac-accent-185529
          node --check runner-capability.mjs
          node --test runner-capability.test.mjs
          xcrun swiftc runner-fixture.swift -o "$RUNNER_TEMP/accent-runner-fixture" > "$GITHUB_WORKSPACE/accent-preflight/evidence/runner-compile.log" 2>&1
          xcrun swiftc runner-probe.swift -o "$RUNNER_TEMP/accent-runner-probe" >> "$GITHUB_WORKSPACE/accent-preflight/evidence/runner-compile.log" 2>&1
          node runner-capability.mjs
      - name: Sanitize synthetic diagnostic paths
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path('accent-preflight/evidence')
          if root.exists():
              for p in root.glob('*.log'):
                  with p.open('rb') as f: data = f.read(4*1024*1024).decode('utf-8', errors='replace')
                  for k in ('HOME','GITHUB_WORKSPACE','RUNNER_TEMP'):
                      if os.environ.get(k): data = data.replace(os.environ[k], '['+k+']')
                  p.write_text(data)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac-accent-helper-185529-${{ github.run_id }}-${{ github.run_attempt }}
          path: accent-preflight/evidence/
          if-no-files-found: error
          retention-days: 14
