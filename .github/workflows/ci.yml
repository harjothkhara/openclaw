name: PR 185529 P3 native validation
run-name: PR 185529 P3 native validation / ${{ inputs.target_sha }}
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact PR head to validate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pr185529-p3-native-validation
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'harjothkhara/openclaw' && github.ref == 'refs/heads/proof/mac-accent-p3-185529-2026-11-02'
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: harjothkhara/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact PR head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-logs
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          observed="$(git ls-remote https://github.com/openclaw/openclaw.git refs/pull/185529/head | cut -f1)"
          [[ "$observed" == "$TARGET_SHA" ]]
          printf 'Target: %s\nWorkflow: %s\n' "$TARGET_SHA" "$GITHUB_SHA" | tee proof-logs/identity.log
          git diff HEAD^ HEAD --check
          git diff HEAD^ HEAD --stat | tee proof-logs/change-stat.log
          swift --version | tee proof-logs/swift-version.log
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Install dependencies and prepare native assets
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee proof-logs/install.log
          node scripts/prepare-apple-mermaid.mjs 2>&1 | tee proof-logs/assets.log
      - name: Install pinned Swift checks
        shell: bash
        run: |
          set -euo pipefail
          scripts/install-swift-tools.sh "$RUNNER_TEMP/pr185529-swift-tools"
          echo "$RUNNER_TEMP/pr185529-swift-tools" >> "$GITHUB_PATH"
      - name: Check Swift lint and formatting
        shell: bash
        run: |
          set -euo pipefail
          scripts/lint-swift.sh macos 2>&1 | tee proof-logs/lint.log
          scripts/format-swift.sh macos 2>&1 | tee proof-logs/format.log
          swiftformat --lint apps/macos/Tests/OpenClawIPCTests/GatewayConnectionPushOwnershipTests.swift --config config/swiftformat 2>&1 | tee proof-logs/test-format.log
      - name: Restore native build cache
        uses: actions/cache/restore@v4
        with:
          path: apps/macos/.build
          key: pr185529-p3-macos26-intel-${{ inputs.target_sha }}-${{ hashFiles('apps/macos/Package.resolved') }}
          restore-keys: |
            mac-accent-app-macos-26-intel-b34033c907786da68f99e5006d0feb2bf8793b7f-
      - name: Build native test bundle
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path apps/macos --build-system native --build-tests 2>&1 | tee proof-logs/build.log
      - name: Run control connection and Talk regressions in isolated runner state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-macos-native.mts default --package-path apps/macos --build-system native --skip-build --filter 'GatewayConnectionControlTests|TalkModeGatewayConfigTests' 2>&1 | tee proof-logs/native-tests.log
          grep -Fq 'Suite GatewayConnectionControlTests passed' proof-logs/native-tests.log
          grep -Fq 'Suite TalkModeGatewayConfigTests passed' proof-logs/native-tests.log
      - name: Run shared preference regressions
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path apps/shared/OpenClawKit --filter GatewayUserPreferencesTests 2>&1 | tee proof-logs/preferences-tests.log
          git diff --check
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]
      - name: Save exact-head native build cache
        uses: actions/cache/save@v4
        with:
          path: apps/macos/.build
          key: pr185529-p3-macos26-intel-${{ inputs.target_sha }}-${{ hashFiles('apps/macos/Package.resolved') }}
      - name: Upload complete validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr185529-p3-native-${{ inputs.target_sha }}
          path: proof-logs/
          if-no-files-found: error
