name: Mac chat accent proof
run-name: PR 185529 ${{ inputs.ui_proof && 'UI' || 'native tests' }} / ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact public openclaw/openclaw commit to test
        required: true
        type: string
        default: ""
      ui_proof:
        description: Run isolated real-app UI proof; exact-head native tests already passed
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mac-chat-accent:
    if: github.repository == 'harjothkhara/openclaw' && github.ref == 'refs/heads/proof/mac-accent-128922-2026-10-27'
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Check out exact PR revision
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 8
          persist-credentials: false

      - name: Verify exact revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-logs
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$TARGET_SHA" ]]
          [[ "$TARGET_SHA" == "b34033c907786da68f99e5006d0feb2bf8793b7f" ]]
          git cat-file -e 1299676aacb6230a0960bd4f2178fb7ddd103849^{commit}
          [[ "$(git merge-base HEAD 1299676aacb6230a0960bd4f2178fb7ddd103849)" == "1299676aacb6230a0960bd4f2178fb7ddd103849" ]]
          printf 'Requested: %s\nChecked out: %s\nWorkflow: %s\n' "$TARGET_SHA" "$actual" "$GITHUB_SHA" | tee proof-logs/identity.log

      - name: Check out fork-only proof driver
        if: ${{ inputs.ui_proof }}
        uses: actions/checkout@v4
        with:
          repository: harjothkhara/openclaw
          ref: ${{ github.sha }}
          path: proof-driver
          sparse-checkout: .github/proof/mac-accent
          persist-credentials: false

      - name: Verify pinned proof driver
        if: ${{ inputs.ui_proof }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C proof-driver rev-parse HEAD)" == "$GITHUB_SHA" ]]
          printf 'Proof driver: %s\n' "$GITHUB_SHA" | tee proof-logs/driver-identity.log

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Select supported Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee proof-logs/install.log

      - name: Prepare native assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-apple-mermaid.mjs 2>&1 | tee proof-logs/assets.log

      - name: Restore prior Mac build for incremental native validation
        if: ${{ !inputs.ui_proof }}
        uses: actions/cache/restore@v4
        with:
          path: apps/macos/.build
          key: mac-accent-app-macos-26-intel-b2b59993fde3932ca23823672aeefbb29435ba95-${{ hashFiles('apps/macos/Package.resolved') }}

      - name: Build macOS test bundle
        if: ${{ !inputs.ui_proof }}
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path apps/macos --build-system native --build-tests 2>&1 | tee proof-logs/build.log

      - name: Run Mac control connection regressions
        if: ${{ !inputs.ui_proof }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-macos-native.mts default \
            --package-path apps/macos \
            --build-system native \
            --skip-build \
            --filter 'GatewayConnectionControlTests' \
            2>&1 | tee proof-logs/control-tests.log
          grep -Fq 'Suite GatewayConnectionControlTests passed' proof-logs/control-tests.log
          grep -Eq 'Test run with [1-9][0-9]* tests' proof-logs/control-tests.log

      - name: Run Mac appearance parser regressions
        if: ${{ !inputs.ui_proof }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-macos-native.mts default \
            --package-path apps/macos \
            --build-system native \
            --skip-build \
            --filter 'TalkModeGatewayConfigTests' \
            2>&1 | tee proof-logs/talk-config-tests.log
          grep -Fq 'Suite TalkModeGatewayConfigTests passed' proof-logs/talk-config-tests.log
          swift test --package-path apps/shared/OpenClawKit --filter GatewayUserPreferencesTests \
            2>&1 | tee proof-logs/preferences-tests.log

      - name: Save exact PR native build
        if: ${{ !inputs.ui_proof }}
        uses: actions/cache/save@v4
        with:
          path: apps/macos/.build
          key: mac-accent-app-macos-26-intel-b34033c907786da68f99e5006d0feb2bf8793b7f-${{ hashFiles('apps/macos/Package.resolved') }}

      - name: Check out red-control revision
        if: ${{ inputs.ui_proof }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 1299676aacb6230a0960bd4f2178fb7ddd103849
          [[ "$(git rev-parse HEAD)" == "1299676aacb6230a0960bd4f2178fb7ddd103849" ]]

      - name: Add identical passive chat observer to red control
        if: ${{ inputs.ui_proof }}
        shell: bash
        run: |
          set -euo pipefail
          node proof-driver/.github/proof/mac-accent/instrument.mjs "$PWD"
          [[ "$(git diff --name-only)" == "apps/macos/Sources/OpenClaw/WebChatSwiftUI.swift" ]]

      - name: Restore red-control Mac app build
        if: ${{ inputs.ui_proof }}
        id: base-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/macos/.build
          key: mac-accent-app-macos-26-intel-1299676aacb6230a0960bd4f2178fb7ddd103849-instrumented-${{ github.sha }}-${{ hashFiles('apps/macos/Package.resolved') }}

      - name: Build red-control Gateway and Mac app
        if: ${{ inputs.ui_proof }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm build:runtime 2>&1 | tee proof-logs/base-gateway-build.log
          swift build --package-path apps/macos --build-system native --product OpenClaw 2>&1 | tee proof-logs/base-app-build.log

      - name: Save red-control Mac app build
        if: ${{ inputs.ui_proof && steps.base-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: apps/macos/.build
          key: mac-accent-app-macos-26-intel-1299676aacb6230a0960bd4f2178fb7ddd103849-instrumented-${{ github.sha }}-${{ hashFiles('apps/macos/Package.resolved') }}

      - name: Require live red control
        if: ${{ inputs.ui_proof }}
        shell: bash
        run: |
          set -euo pipefail
          node proof-driver/.github/proof/mac-accent/drive.mjs \
            "$PWD" \
            "$PWD/proof-driver/.github/proof/mac-accent" \
            "$PWD/proof-logs/red-control" red \
            2>&1 | tee proof-logs/red-control-run.log
          node -e 'const r=require("./proof-logs/red-control/result.json");if(r.status!=="expected-failure"||r.head!=="1299676aacb6230a0960bd4f2178fb7ddd103849")process.exit(1)'

      - name: Restore exact PR revision
        if: ${{ inputs.ui_proof }}
        shell: bash
        run: |
          set -euo pipefail
          git restore apps/macos/Sources/OpenClaw/WebChatSwiftUI.swift
          rm -rf apps/macos/.build
          git checkout --detach b34033c907786da68f99e5006d0feb2bf8793b7f
          [[ "$(git rev-parse HEAD)" == "b34033c907786da68f99e5006d0feb2bf8793b7f" ]]
          git diff --name-only 1299676aacb6230a0960bd4f2178fb7ddd103849 HEAD | grep -Ev '^(apps/macos/|apps/shared/OpenClawKit/(Sources/OpenClawKit/GatewayUserPreferences.swift|Tests/OpenClawKitTests/GatewayUserPreferencesTests.swift)$)' > proof-logs/non-mac-changes.log || true
          [[ ! -s proof-logs/non-mac-changes.log ]]

      - name: Add identical passive chat observer to PR app
        if: ${{ inputs.ui_proof }}
        shell: bash
        run: |
          set -euo pipefail
          node proof-driver/.github/proof/mac-accent/instrument.mjs "$PWD"
          [[ "$(git diff --name-only)" == "apps/macos/Sources/OpenClaw/WebChatSwiftUI.swift" ]]

      - name: Restore PR Mac app build
        if: ${{ inputs.ui_proof }}
        id: head-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/macos/.build
          key: mac-accent-app-macos-26-intel-b34033c907786da68f99e5006d0feb2bf8793b7f-instrumented-${{ github.sha }}-${{ hashFiles('apps/macos/Package.resolved') }}

      - name: Build PR Mac app against the identical Gateway runtime
        if: ${{ inputs.ui_proof }}
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path apps/macos --build-system native --product OpenClaw 2>&1 | tee proof-logs/head-app-build.log

      - name: Save PR Mac app build
        if: ${{ inputs.ui_proof && steps.head-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: apps/macos/.build
          key: mac-accent-app-macos-26-intel-b34033c907786da68f99e5006d0feb2bf8793b7f-instrumented-${{ github.sha }}-${{ hashFiles('apps/macos/Package.resolved') }}

      - name: Require live green result
        if: ${{ inputs.ui_proof }}
        shell: bash
        run: |
          set -euo pipefail
          node proof-driver/.github/proof/mac-accent/drive.mjs \
            "$PWD" \
            "$PWD/proof-driver/.github/proof/mac-accent" \
            "$PWD/proof-logs/green-head" green \
            2>&1 | tee proof-logs/green-head-run.log
          node -e 'const r=require("./proof-logs/green-head/result.json");if(!["passed","passed-instrumented"].includes(r.status)||r.head!=="b34033c907786da68f99e5006d0feb2bf8793b7f")process.exit(1)'

      - name: Upload complete proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-chat-accent-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof-logs/
          if-no-files-found: error
